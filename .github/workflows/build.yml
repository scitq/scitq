# .github/workflows/build.yml
name: Build
on:
  push:
    tags-ignore:
      - '**'
    branches:
      - '**'
  pull_request:

# GitHub is forcing all JavaScript-based actions onto Node 24 in June 2026.
# Some actions we depend on (actions/setup-go@v5 as of this writing) still
# declare Node 20, which surfaces as a noisy deprecation warning on every
# job. Opting in early via the documented env var silences the warning and
# matches what GitHub will enforce by default — when an updated setup-go
# ships, we can drop this. See:
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Node is only needed on the build job: `go build ./...` triggers
      # //go:embed all:public in server/http.go, and server/public is
      # .gitignored — it lives on disk after `make ui-embed` (vite build)
      # regenerates it from ui/. The UI component tests run here too, so
      # the Go test jobs stay on Go-only runners.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build Go project
        run: make ui-embed copy-docs && go build ./...

      - name: UI component tests
        run: make ui-test

  # The documentation site builds, with no broken link (mkdocs --strict).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the documentation site
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict

  # Unit tests outside tests/integration: Go packages and the Python DSL suite.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Go unit tests
        run: make copy-docs && go test $(go list ./... | grep -v /tests/integration)

      - name: Python tests
        run: |
          pip install grpcio grpcio-tools pyyaml pytest
          cd python && python -m pytest -q

  # Compatibility with the last release (docs/reference/compatibility.md):
  # no breaking gRPC change, nothing removed from the recorded public
  # surfaces (compat/*.txt), and those files match the code.
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # release tags are the compatibility baseline

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compatibility checks
        run: |
          pip install grpcio grpcio-tools pyyaml pytest
          make copy-docs compat

  # Upgrade from the last release to this commit with a live worker:
  # server switch mid-workflow, migrations, then an in-place worker upgrade.
  test-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the last release tag is built and run

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pre-pull Docker images
        run: docker pull postgres:17-alpine

      - name: Upgrade test
        run: make upgrade-test

  test-core:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pre-pull Docker images
        run: docker pull postgres:17-alpine

      - name: Core tests
        run: make copy-docs && cd tests/integration && go test -v -run 'TestIntegration$|TestTaskDependency|TestWorkflowStatus|TestFreeWorkers|TestRetryClonesHiddenParent|TestRetryCLI|TestMCPEndToEnd|TestTaskStdoutStderr' ./...

  test-reuse-skip:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pre-pull Docker images
        run: docker pull postgres:17-alpine

      - name: Reuse and skip tests
        run: make copy-docs && cd tests/integration && go test -v -run 'TestReuse|TestSkipIfExists|TestForceRunTask|TestPublishOnly' ./...

  test-edit-quality:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pre-pull Docker images
        run: docker pull postgres:17-alpine

      - name: Edit, quality, optuna, signal tests
        run: make copy-docs && cd tests/integration && go test -v -run 'TestEditAndRetry|TestEditStepCommand|TestQualityScoring|TestMultiObjectiveQuality|TestOptunaLoop|TestSignalStop|TestLiveQualityMonitoring|TestEnvVars|TestWorkflowCounters|TestPermanentWorkerProtection' ./...

  test-fetch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pre-pull Docker images
        run: docker pull postgres:17-alpine

      - name: Fetch integration test
        run: make copy-docs && cd tests/integration && go test -v -run 'TestFetchIntegration' ./...

  test-recruitment:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pre-pull Docker images
        run: docker pull postgres:17-alpine

      - name: Recruitment tests
        run: make copy-docs && cd tests/integration && go test -v -timeout 300s -run 'TestRecruitmentCycle|TestLongRecruiter' ./...

  test-all:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pre-pull Docker images
        run: docker pull postgres:17-alpine

      - name: Run uncovered tests (catch-all for new tests)
        run: |
          # `copy-docs` now depends on `tgz-python-src` (see the Makefile
          # comment on that target), so the embedded Python tarball
          # (//go:embed python-src.tgz) is rebuilt automatically before
          # tests that upload+run a real template (e.g. TestExtendWorkflowE2E)
          # exercise the DSL source. No separate call needed here.
          make copy-docs
          COVERED="TestIntegration|TestTaskDependency|TestWorkflowStatus|TestFreeWorkers|TestRetryClonesHiddenParent|TestRetryCLI|TestMCPEndToEnd|TestTaskStdoutStderr|TestReuse|TestSkipIfExists|TestForceRunTask|TestPublishOnly|TestEditAndRetry|TestEditStepCommand|TestQualityScoring|TestMultiObjectiveQuality|TestOptunaLoop|TestSignalStop|TestEnvVars|TestWorkflowCounters|TestFetchIntegration|TestRecruitmentCycle|TestLongRecruiter|TestLiveQualityMonitoring|TestPermanentWorkerProtection"
          ALL=$(cd tests/integration && grep -h '^func Test' *_test.go | sed 's/func \(Test[a-zA-Z0-9_]*\).*/\1/' | sort -u)
          UNCOVERED=""
          for t in $ALL; do
            if ! echo "$t" | grep -qE "$COVERED"; then
              UNCOVERED="$UNCOVERED|$t"
            fi
          done
          UNCOVERED="${UNCOVERED#|}"
          if [ -n "$UNCOVERED" ]; then
            echo "Running uncovered tests: $UNCOVERED"
            cd tests/integration && go test -v -run "$UNCOVERED" ./...
          else
            echo "All tests are covered by named jobs"
          fi
