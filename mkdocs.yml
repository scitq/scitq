site_name: scitq Documentation
site_description: "Documentation for scitq  – distributed task queue engine (Go + Python + Svelte)"
site_url: https://scitq.readthedocs.io/
repo_url: https://github.com/scitq/scitq
repo_name: scitq.scitq
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan
  features:
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - content.code.annotate
    - content.code.copy
    - search.highlight

plugins:
  - search
  - include-markdown

# Internal meeting notes are kept in the repository, not published.
exclude_docs: |
  meetings/

nav:
  - Home: index.md
  - Motivation: motivation.md
  - Concepts: concepts.md
  - Installation: install.md
  - Upgrading: upgrading.md
  - Usage:
      - Basic usage: usage/basic.md
      - Web UI: usage/ui.md
      - CLI: usage/cli.md
      - YAML Templates: usage/yaml-templates.md
      - Python DSL: usage/dsl.md
      - Optimization: usage/optimization.md
      - AI Integration: usage/ai-integration.md
      - Converting Nextflow: usage/convert-nextflow.md
      - Converting Snakemake: usage/convert-snakemake.md
  - Reference:
      - Configuration: reference/configuration.md
      - Recruitment: reference/recruitment.md
      - Compatibility: reference/compatibility.md
      - Security: reference/security.md
      - Monitoring: reference/monitoring.md
      - Module Library: reference/module-library.md
      - Python DSL API: reference/python_dsl.md
      - Data model: model.md
      - Database schema: schema.md
      - gRPC API: api.md
  - Development: dev.md
  - Changelog: changelog.md
